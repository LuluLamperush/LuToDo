<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuToDo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-700-normal.css">
<style>
*{font-family:'JetBrains Mono',monospace;color:#111}
body{background:#fff;overflow:hidden}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#fff0f0}
::-webkit-scrollbar-thumb{background:#dc2626;border-radius:3px}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.4)}50%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes dropIn{from{opacity:0;transform:translateY(-30px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 5px rgba(220,38,38,.2)}50%{box-shadow:0 0 20px rgba(220,38,38,.4)}}
.anim-slide{animation:slideIn .3s ease-out both}
.anim-fade{animation:fadeUp .35s ease-out both}
.anim-pop{animation:popIn .25s cubic-bezier(.34,1.56,.64,1) both}
.anim-shake{animation:shake .3s ease}
.anim-drop{animation:dropIn .4s cubic-bezier(.34,1.56,.64,1) both}
.btn-ripple{position:relative;overflow:hidden}
.btn-ripple .rp{position:absolute;border-radius:50%;background:rgba(220,38,38,.25);animation:ripple .6s linear;pointer-events:none}
.note-card{transition:all .2s cubic-bezier(.4,0,.2,1)}
.note-card:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(220,38,38,.15)}
.folder-item{transition:all .2s ease}
.folder-item:hover{background:#fef2f2;padding-left:20px}
.folder-item.active{background:#fee2e2;border-left:3px solid #dc2626}
.modal-bg{transition:opacity .3s ease}
.modal-box{transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.editor-area{transition:all .3s ease}
.sidebar{transition:width .3s cubic-bezier(.4,0,.2,1)}
.tab-btn{transition:all .2s ease}
.tab-btn.active{background:#dc2626;color:#fff}
.img-preview{max-width:100%;border-radius:8px;margin:8px 0;border:2px solid #fecaca}
.toast{animation:dropIn .4s ease-out both}
.toast-exit{animation:fadeUp .3s ease-in reverse both}
html{scroll-behavior:smooth}
</style>
</head>
<body class="h-screen flex">

<div id="app" class="flex w-full h-full">

<aside id="sidebar" class="sidebar w-72 bg-gradient-to-b from-red-50 to-white border-r-2 border-red-100 flex flex-col h-full">
<div class="p-5 border-b-2 border-red-100">
<h1 class="text-2xl font-bold text-red-600 tracking-tight">Lu<span class="text-red-400">ToDo</span></h1>
<p class="text-xs text-red-300 mt-1">your notes, your way</p>
</div>
<div class="p-3">
<button onclick="createFolder()" class="btn-ripple w-full py-2.5 bg-red-600 text-white rounded-lg text-sm font-bold hover:bg-red-700 transition-all duration-200 hover:shadow-lg hover:shadow-red-200 active:scale-95">
+ New Folder
</button>
</div>
<div id="folderList" class="flex-1 overflow-y-auto px-2 pb-4"></div>
<div class="p-3 border-t-2 border-red-100">
<button onclick="toggleSidebar()" class="w-full py-2 text-red-400 text-xs hover:text-red-600 transition-colors">
◀ Collapse
</button>
</div>
</aside>

<main class="flex-1 flex flex-col h-full">
<header class="h-16 border-b-2 border-red-100 flex items-center px-6 gap-4 bg-white/80 backdrop-blur">
<button onclick="toggleSidebar()" id="menuBtn" class="hidden p-2 hover:bg-red-50 rounded-lg transition-all">
<svg width="20" height="20" viewBox="0 0 20 20" fill="#dc2626"><rect y="3" width="20" height="2" rx="1"/><rect y="9" width="20" height="2" rx="1"/><rect y="15" width="20" height="2" rx="1"/></svg>
</button>
<div id="breadcrumb" class="flex items-center gap-2 text-sm"></div>
<div class="ml-auto flex gap-2">
<button onclick="createNote()" id="addNoteBtn" class="btn-ripple px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-bold hover:bg-red-700 transition-all duration-200 hover:shadow-lg hover:shadow-red-200 active:scale-95">
+ Note
</button>
</div>
</header>

<div class="flex-1 flex overflow-hidden">
<div id="notesPanel" class="w-80 border-r-2 border-red-100 overflow-y-auto bg-white">
<div id="notesList" class="p-3 space-y-2"></div>
</div>

<div id="editorPanel" class="flex-1 flex flex-col h-full bg-white">
<div id="editorHeader" class="hidden border-b-2 border-red-100 p-4 flex items-center gap-3">
<input id="noteTitle" class="flex-1 text-xl font-bold bg-transparent outline-none border-b-2 border-transparent focus:border-red-400 transition-colors px-1 py-1" placeholder="Note title...">
<div class="flex gap-1">
<button onclick="setMode('md')" id="modeMd" class="tab-btn px-3 py-1.5 rounded-md text-xs font-bold border border-red-200">MD</button>
<button onclick="setMode('html')" id="modeHtml" class="tab-btn px-3 py-1.5 rounded-md text-xs font-bold border border-red-200">HTML</button>
<button onclick="setMode('preview')" id="modePreview" class="tab-btn px-3 py-1.5 rounded-md text-xs font-bold border border-red-200">Preview</button>
</div>
<button onclick="uploadImage()" class="p-2 hover:bg-red-50 rounded-lg transition-all" title="Upload image">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
</button>
<button onclick="deleteCurrentNote()" class="p-2 hover:bg-red-50 rounded-lg transition-all" title="Delete note">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14"/></svg>
</button>
</div>
<div id="editorBody" class="flex-1 overflow-hidden flex flex-col">
<div id="emptyState" class="flex-1 flex items-center justify-center">
<div class="text-center anim-fade">
<div class="text-6xl mb-4">📝</div>
<p class="text-red-300 text-lg">Select or create a note</p>
<p class="text-red-200 text-sm mt-2">Your thoughts await</p>
</div>
</div>
<textarea id="editor" class="editor-area hidden flex-1 w-full p-6 text-sm leading-relaxed resize-none outline-none bg-transparent" placeholder="Start writing... (Markdown or HTML)"></textarea>
<div id="preview" class="editor-area hidden flex-1 overflow-y-auto p-6"></div>
</div>
</div>
</div>
</main>
</div>

<div id="modal" class="modal-bg fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-50 hidden opacity-0">
<div class="modal-box bg-white rounded-2xl p-6 w-96 shadow-2xl shadow-red-100 scale-95">
<h3 id="modalTitle" class="text-lg font-bold text-red-600 mb-4"></h3>
<input id="modalInput" class="w-full px-4 py-3 border-2 border-red-200 rounded-xl outline-none focus:border-red-500 transition-colors text-sm" placeholder="Enter name...">
<div class="flex gap-3 mt-5">
<button onclick="closeModal()" class="flex-1 py-2.5 border-2 border-red-200 rounded-xl text-sm font-bold text-red-400 hover:bg-red-50 transition-all">Cancel</button>
<button id="modalConfirm" class="flex-1 py-2.5 bg-red-600 text-white rounded-xl text-sm font-bold hover:bg-red-700 transition-all active:scale-95">Confirm</button>
</div>
</div>
</div>

<div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>

<input type="file" id="imageInput" class="hidden" accept="image/*">

<script>
var _0x = {
k1: 'bHV0b2RvX2ZsZHM=',
k2: 'bHV0b2RvX250cw==',
k3: 'bHV0b2RvX2FjdA==',
enc: function(d){ return btoa(unescape(encodeURIComponent(JSON.stringify(d)))) },
dec: function(s){ try{ return JSON.parse(decodeURIComponent(escape(atob(s)))) }catch(e){ return null } }
};

var folders = _0x.dec(localStorage.getItem(_0x.k1)) || [];
var notes = _0x.dec(localStorage[_0x.k2]) || [];
var activeFolder = localStorage[_0x.k3] || null;
var activeNote = null;
var currentMode = 'md';
var saveTimer = null;

function persist(){
localStorage[_0x.k1] = _0x.enc(folders);
localStorage[_0x.k2] = _0x.enc(notes);
if(activeFolder) localStorage[_0x.k3] = activeFolder;
}

function toast(msg, type){
var t = document.createElement('div');
var colors = type === 'error' ? 'bg-red-600' : 'bg-green-600';
t.className = 'toast ' + colors + ' text-white px-5 py-3 rounded-xl text-sm font-bold shadow-lg';
t.textContent = msg;
document.getElementById('toastContainer').appendChild(t);
setTimeout(function(){ t.classList.add('toast-exit'); setTimeout(function(){ t.remove() }, 300) }, 2500);
}

function addRipple(e){
var btn = e.currentTarget;
var r = document.createElement('span');
var rect = btn.getBoundingClientRect();
var sz = Math.max(rect.width, rect.height);
r.className = 'rp';
r.style.width = r.style.height = sz + 'px';
r.style.left = (e.clientX - rect.left - sz/2) + 'px';
r.style.top = (e.clientY - rect.top - sz/2) + 'px';
btn.appendChild(r);
setTimeout(function(){ r.remove() }, 600);
}

document.querySelectorAll('.btn-ripple').forEach(function(b){
b.addEventListener('click', addRipple);
});

function showModal(title, placeholder, callback){
var m = document.getElementById('modal');
document.getElementById('modalTitle').textContent = title;
var inp = document.getElementById('modalInput');
inp.value = '';
inp.placeholder = placeholder;
m.classList.remove('hidden');
requestAnimationFrame(function(){
m.style.opacity = '1';
m.querySelector('.modal-box').style.transform = 'scale(1)';
});
inp.focus();
var confirm = document.getElementById('modalConfirm');
var newConfirm = confirm.cloneNode(true);
confirm.parentNode.replaceChild(newConfirm, confirm);
newConfirm.id = 'modalConfirm';
newConfirm.addEventListener('click', function(){
if(inp.value.trim()){ callback(inp.value.trim()); closeModal() }
else{ inp.classList.add('anim-shake'); setTimeout(function(){ inp.classList.remove('anim-shake') }, 300) }
});
inp.onkeydown = function(e){ if(e.key === 'Enter') newConfirm.click() };
}

function closeModal(){
var m = document.getElementById('modal');
m.style.opacity = '0';
m.querySelector('.modal-box').style.transform = 'scale(.95)';
setTimeout(function(){ m.classList.add('hidden') }, 300);
}

function createFolder(){
showModal('New Folder', 'Folder name...', function(name){
var f = { id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), name: name, created: Date.now() };
folders.push(f);
persist();
renderFolders();
toast('Folder created');
});
}

function renameFolder(fid){
var f = folders.find(function(x){ return x.id === fid });
if(!f) return;
showModal('Rename Folder', f.name, function(name){
f.name = name;
persist();
renderFolders();
toast('Folder renamed');
});
}

function deleteFolder(fid){
if(!confirm('Delete folder and all its notes?')) return;
folders = folders.filter(function(x){ return x.id !== fid });
notes = notes.filter(function(x){ return x.folderId !== fid });
if(activeFolder === fid){ activeFolder = null; activeNote = null }
persist();
renderFolders();
renderNotes();
renderEditor();
toast('Folder deleted');
}

function selectFolder(fid){
activeFolder = fid;
activeNote = null;
persist();
renderFolders();
renderNotes();
renderEditor();
}

function renderFolders(){
var el = document.getElementById('folderList');
if(!folders.length){
el.innerHTML = '<div class="text-center py-10 text-red-200 text-sm anim-fade"><div class="text-3xl mb-2">📁</div>No folders yet</div>';
return;
}
el.innerHTML = folders.map(function(f, i){
var count = notes.filter(function(n){ return n.folderId === f.id }).length;
var active = f.id === activeFolder ? 'active' : '';
return '<div class="folder-item ' + active + ' flex items-center gap-2 px-4 py-3 rounded-xl cursor-pointer mb-1 anim-slide" style="animation-delay:' + (i*50) + 'ms" onclick="selectFolder(\'' + f.id + '\')">' +
'<span class="text-red-400 text-lg">📁</span>' +
'<span class="flex-1 text-sm font-bold truncate">' + escHtml(f.name) + '</span>' +
'<span class="text-xs text-red-300 bg-red-50 px-2 py-0.5 rounded-full">' + count + '</span>' +
'<button onclick="event.stopPropagation();renameFolder(\'' + f.id + '\')" class="p-1 hover:bg-red-100 rounded transition-all opacity-0 group-hover:opacity-100" title="Rename">' +
'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2"><path d="M17 3a2.83 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>' +
'<button onclick="event.stopPropagation();deleteFolder(\'' + f.id + '\')" class="p-1 hover:bg-red-100 rounded transition-all" title="Delete">' +
'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>' +
'</div>';
}).join('');
el.querySelectorAll('.folder-item').forEach(function(item){
item.classList.add('group');
});
}

function createNote(){
if(!activeFolder){ toast('Select a folder first', 'error'); return }
showModal('New Note', 'Note title...', function(title){
var n = {
id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
folderId: activeFolder,
title: title,
content: '',
mode: 'md',
created: Date.now(),
updated: Date.now()
};
notes.push(n);
activeNote = n.id;
persist();
renderNotes();
renderEditor();
toast('Note created');
});
}

function selectNote(nid){
activeNote = nid;
renderNotes();
renderEditor();
}

function deleteCurrentNote(){
if(!activeNote) return;
if(!confirm('Delete this note?')) return;
notes = notes.filter(function(x){ return x.id !== activeNote });
activeNote = null;
persist();
renderNotes();
renderEditor();
toast('Note deleted');
}

function renderNotes(){
var el = document.getElementById('notesList');
var list = notes.filter(function(n){ return n.folderId === activeFolder }).sort(function(a,b){ return b.updated - a.updated });
if(!activeFolder){
el.innerHTML = '<div class="text-center py-16 text-red-200 text-sm anim-fade"><div class="text-4xl mb-3">👈</div>Select a folder</div>';
return;
}
if(!list.length){
el.innerHTML = '<div class="text-center py-16 text-red-200 text-sm anim-fade"><div class="text-4xl mb-3">📄</div>No notes yet<br><span class="text-xs mt-2 block">Click "+ Note" to start</span></div>';
return;
}
el.innerHTML = list.map(function(n, i){
var active = n.id === activeNote ? 'border-red-500 bg-red-50' : 'border-transparent hover:border-red-200';
var preview = stripTags(n.content).slice(0, 60);
var date = new Date(n.updated);
var dateStr = date.toLocaleDateString('en-US', {month:'short',day:'numeric'});
return '<div class="note-card anim-pop border-2 ' + active + ' rounded-xl p-4 cursor-pointer mb-2" style="animation-delay:' + (i*60) + 'ms" onclick="selectNote(\'' + n.id + '\')">' +
'<div class="font-bold text-sm truncate mb-1">' + escHtml(n.title) + '</div>' +
'<div class="text-xs text-red-300 truncate mb-2">' + (preview || 'Empty note') + '</div>' +
'<div class="text-xs text-red-200">' + dateStr + '</div>' +
'</div>';
}).join('');
}

function renderEditor(){
var header = document.getElementById('editorHeader');
var empty = document.getElementById('emptyState');
var ed = document.getElementById('editor');
var pv = document.getElementById('preview');

if(!activeNote){
header.classList.add('hidden');
header.style.display = 'none';
empty.classList.remove('hidden');
ed.classList.add('hidden');
pv.classList.add('hidden');
updateBreadcrumb();
return;
}

var n = notes.find(function(x){ return x.id === activeNote });
if(!n) return;

header.classList.remove('hidden');
header.style.display = 'flex';
empty.classList.add('hidden');

document.getElementById('noteTitle').value = n.title;
currentMode = n.mode || 'md';
setMode(currentMode, true);
updateBreadcrumb();
}

function setMode(m, silent){
currentMode = m;
var ed = document.getElementById('editor');
var pv = document.getElementById('preview');

document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active') });
var btn = document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1));
if(btn) btn.classList.add('active');

if(m === 'preview'){
ed.classList.add('hidden');
pv.classList.remove('hidden');
pv.classList.add('anim-fade');
renderPreview();
} else {
pv.classList.add('hidden');
ed.classList.remove('hidden');
ed.classList.add('anim-fade');
ed.focus();
}

if(!silent && activeNote){
var n = notes.find(function(x){ return x.id === activeNote });
if(n){ n.mode = m; persist() }
}
}

function renderPreview(){
var n = notes.find(function(x){ return x.id === activeNote });
if(!n) return;
var pv = document.getElementById('preview');
var raw = n.content || '';

if(n.mode === 'html'){
var clean = raw.replace(/<script[\s\S]*?<\/script>/gi, '').replace(/<style[\s\S]*?<\/style>/gi, '');
pv.innerHTML = '<div class="prose max-w-none anim-fade">' + clean + '</div>';
} else {
pv.innerHTML = '<div class="prose max-w-none anim-fade">' + marked.parse(raw) + '</div>';
}

pv.querySelectorAll('img').forEach(function(img){
img.classList.add('img-preview');
});
}

function uploadImage(){
if(!activeNote){ toast('Select a note first', 'error'); return }
document.getElementById('imageInput').click();
}

document.getElementById('imageInput').addEventListener('change', function(e){
var file = e.target.files[0];
if(!file) return;
if(file.size > 2 * 1024 * 1024){
toast('Image too large (max 2MB)', 'error');
return;
}
var reader = new FileReader();
reader.onload = function(ev){
var n = notes.find(function(x){ return x.id === activeNote });
if(!n) return;
var tag = '![' + file.name + '](' + ev.target.result + ')';
if(n.mode === 'html'){
tag = '<img src="' + ev.target.result + '" alt="' + escHtml(file.name) + '" class="img-preview">';
}
n.content += '\n' + tag;
n.updated = Date.now();
persist();
if(currentMode === 'preview') renderPreview();
else document.getElementById('editor').value = n.content;
toast('Image added');
};
reader.readAsDataURL(file);
e.target.value = '';
});

document.getElementById('noteTitle').addEventListener('input', function(e){
var n = notes.find(function(x){ return x.id === activeNote });
if(!n) return;
n.title = e.target.value;
n.updated = Date.now();
debounceSave();
});

document.getElementById('editor').addEventListener('input', function(e){
var n = notes.find(function(x){ return x.id === activeNote });
if(!n) return;
n.content = e.target.value;
n.updated = Date.now();
debounceSave();
});

function debounceSave(){
clearTimeout(saveTimer);
saveTimer = setTimeout(function(){
persist();
renderNotes();
}, 400);
}

function updateBreadcrumb(){
var el = document.getElementById('breadcrumb');
var f = folders.find(function(x){ return x.id === activeFolder });
var n = notes.find(function(x){ return x.id === activeNote });
var html = '';
if(f){
html += '<span class="text-red-400 cursor-pointer hover:text-red-600 transition-colors" onclick="selectFolder(null);activeFolder=\'' + f.id + '\'">📁 ' + escHtml(f.name) + '</span>';
}
if(n){
html += '<span class="text-red-300 mx-1">/</span>';
html += '<span class="font-bold text-red-600">' + escHtml(n.title) + '</span>';
}
if(!f && !n) html = '<span class="text-red-300">LuToDo</span>';
el.innerHTML = html;
}

function toggleSidebar(){
var sb = document.getElementById('sidebar');
var btn = document.getElementById('menuBtn');
if(sb.style.width === '0px'){
sb.style.width = '288px';
sb.style.overflow = '';
btn.classList.add('hidden');
} else {
sb.style.width = '0px';
sb.style.overflow = 'hidden';
btn.classList.remove('hidden');
}
}

function escHtml(s){
var d = document.createElement('div');
d.textContent = s || '';
return d.innerHTML;
}

function stripTags(s){
var d = document.createElement('div');
d.innerHTML = s || '';
return d.textContent || '';
}

document.addEventListener('keydown', function(e){
if(e.key === 'Escape') closeModal();
});

renderFolders();
renderNotes();
renderEditor();
</script>
</body>
</html>
